<text x="58" y="110" font-size="12" fill="#80e0df">01 / PROGRAM</text><text x="58" y="149" font-size="25" fill="#f1f5ff">ca + Python</text><text x="58" y="179" font-size="15" fill="#a7b5ce">Conditions, observations, reusable modules.</text><text x="58" y="204" font-size="15" fill="#a7b5ce">Deadlines, budgets, outcome checks.</text>
<text x="457" y="110" font-size="12" fill="#b4a0ff">02 / COORDINATE</text><text x="457" y="149" font-size="25" fill="#f1f5ff">Native KWin plugin</text><text x="457" y="179" font-size="15" fill="#a7b5ce">App ownership and independent pointer.</text><text x="457" y="204" font-size="15" fill="#a7b5ce">Takeover, release, cursor overlay.</text>
<text x="856" y="110" font-size="12" fill="#80e0df">03 / ACT</text><text x="856" y="149" font-size="25" fill="#f1f5ff">Your open application</text><text x="856" y="179" font-size="15" fill="#a7b5ce">Native Wayland pointer events.</text><text x="856" y="204" font-size="15" fill="#a7b5ce">Clicks, scrolling, continuous drags.</text>
<rect x="36" y="252" width="1128" height="56" rx="12" fill="#141b2b"/>
<text x="58" y="286" font-size="16" fill="#c5cfe2"><tspan fill="#80e0df" font-weight="700">Default: independent agent pointer.</tspan>  Explicit --host: real pointer and desktop focus. Physical input takes priority.</text>
