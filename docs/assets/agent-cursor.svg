<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title">
<title id="title">The agent's ink pen cursor: writing leaves a fading ink stroke, a click splashes, and at rest a drop gathers on the nib</title>
<defs>
  <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b0c3ed" stroke-opacity=".05"/></pattern>
  <!-- Pen parts as (along, across) the pen from the nib tip; see computer_artist/ink_cursor.py. -->
  <g id="pen-shape">
    <polygon points="0,0 3,-1.2 6.5,-2.6 10,-3.8 12.5,-4.2 12.5,-4.4 17,-4.7 17,-5.1 18.6,-5.2 36,-5.2 38,-3.9 38.8,0 38,3.9 36,5.2 18.6,5.2 17,5.1 17,4.7 12.5,4.4 12.5,4.2 10,3.8 6.5,2.6 3,1.2"/>
  </g>
  <g id="pen" transform="rotate(-50) scale(1.15)">
    <use xlink:href="#pen-shape" fill="#4058ff" opacity=".75" filter="url(#bloom)"/>
    <polygon points="18.6,-5.2 36,-5.2 38,-3.9 38.8,0 38,3.9 36,5.2 18.6,5.2" fill="#4058ff"/>
    <polygon points="18.6,.8 36.4,.8 38.3,2.6 38,3.9 36,5.2 18.6,5.2" fill="#2c3aa5"/>
    <polygon points="19.6,-3.7 34.6,-3.7 34.6,-2.2 19.6,-2.2" fill="#9eabff"/>
    <polygon points="12.5,-4.4 17,-4.7 17,4.7 12.5,4.4" fill="#161456"/>
    <polygon points="17,-5.1 18.6,-5.1 18.6,5.1 17,5.1" fill="#c8d4f0"/>
    <polygon points="0,0 3,-1.2 6.5,-2.6 10,-3.8 12.5,-4.2 12.5,4.2 10,3.8 6.5,2.6 3,1.2" fill="#fcfcff"/>
    <polygon points="0,0 12.5,0 12.5,4.2 10,3.8 6.5,2.6 3,1.2" fill="#d6defa"/>
    <use xlink:href="#pen-shape" fill="none" stroke="#161456" stroke-width="1" stroke-linejoin="round"/>
    <path d="M1.4 0H8.2" stroke="#161456" stroke-width="1"/>
    <circle cx="8.9" cy="0" r=".9" fill="#161456"/>
    <path d="M22 -6.1H33.5" stroke="#c8d4f0" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="33.5" cy="-6.1" r="1.2" fill="#c8d4f0"/>
  </g>
  <path id="writing" pathLength="1000" d="M70 222C112 120 160 270 214 186S300 112 322 168"/>
</defs>
<rect width="1200" height="360" rx="24" fill="#0d1220"/>
<rect width="1200" height="360" rx="24" fill="url(#grid)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="36" y="42" font-size="13" letter-spacing="2" fill="#8ea3c7">THE AGENT'S INK PEN</text>
<path d="M400 74V290M800 74V290" stroke="#26324a"/>

<!-- Writing: three dash segments ending at the nib form a tapered, fading stroke. -->
<g fill="none" stroke-linecap="round">
  <use xlink:href="#writing" stroke="#4058ff" stroke-opacity=".18" stroke-width="16" stroke-dasharray="160 3000" filter="url(#bloom)">
    <animate attributeName="stroke-dashoffset" values="160;-840" dur="3s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#writing" stroke="#4058ff" stroke-opacity=".3" stroke-width="2" stroke-dasharray="240 3000">
    <animate attributeName="stroke-dashoffset" values="240;-760" dur="3s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#writing" stroke="#4058ff" stroke-opacity=".65" stroke-width="4.5" stroke-dasharray="150 3000">
    <animate attributeName="stroke-dashoffset" values="150;-850" dur="3s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#writing" stroke="#4058ff" stroke-width="7.5" stroke-dasharray="70 3000">
    <animate attributeName="stroke-dashoffset" values="70;-930" dur="3s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#writing" stroke="#84d2ff" stroke-width="2" stroke-dasharray="60 3000">
    <animate attributeName="stroke-dashoffset" values="60;-940" dur="3s" repeatCount="indefinite"/>
  </use>
</g>
<g><use xlink:href="#pen" transform="scale(1.7)"/>
  <animateMotion dur="3s" repeatCount="indefinite"><mpath xlink:href="#writing"/></animateMotion>
</g>
<text x="200" y="300" text-anchor="middle" font-size="22" fill="#f1f5ff">Writing leaves ink</text>
<text x="200" y="326" text-anchor="middle" font-size="15" fill="#93a3c2">A tapered stroke flows from the nib and fades</text>

<!-- Click: wobbling ring, blot and droplets; the pen presses into the page. -->
<g transform="translate(600 180)">
  <circle r="4" fill="none" stroke="#4058ff" stroke-width="3.4">
    <animate attributeName="r" values="4;30;30" keyTimes="0;.34;1" keySplines=".2 .8 .3 1;0 0 1 1" calcMode="spline" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="1;0;0" keyTimes="0;.34;1" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="3.4;.8;.8" keyTimes="0;.34;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="5.5" fill="#4058ff">
    <animate attributeName="r" values="5.5;0;0" keyTimes="0;.34;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <g fill="#4058ff">
    <circle r="2.6"><animateTransform attributeName="transform" type="translate" values="0 0;30 -18;30 -18" keyTimes="0;.38;1" dur="1.6s" repeatCount="indefinite"/><animate attributeName="r" values="2.6;0;0" keyTimes="0;.38;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle r="2"><animateTransform attributeName="transform" type="translate" values="0 0;-26 -24;-26 -24" keyTimes="0;.38;1" dur="1.6s" repeatCount="indefinite"/><animate attributeName="r" values="2;0;0" keyTimes="0;.38;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle r="2.3"><animateTransform attributeName="transform" type="translate" values="0 0;-34 10;-34 10" keyTimes="0;.38;1" dur="1.6s" repeatCount="indefinite"/><animate attributeName="r" values="2.3;0;0" keyTimes="0;.38;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle r="1.8"><animateTransform attributeName="transform" type="translate" values="0 0;8 34;8 34" keyTimes="0;.38;1" dur="1.6s" repeatCount="indefinite"/><animate attributeName="r" values="1.8;0;0" keyTimes="0;.38;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle r="2.2"><animateTransform attributeName="transform" type="translate" values="0 0;34 20;34 20" keyTimes="0;.38;1" dur="1.6s" repeatCount="indefinite"/><animate attributeName="r" values="2.2;0;0" keyTimes="0;.38;1" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>
  <g><use xlink:href="#pen" transform="scale(1.7)"/>
    <animateTransform attributeName="transform" type="scale" values="1;.9;1;1" keyTimes="0;.06;.2;1" dur="1.6s" repeatCount="indefinite"/>
  </g>
</g>
<text x="600" y="300" text-anchor="middle" font-size="22" fill="#f1f5ff">A click splashes</text>
<text x="600" y="326" text-anchor="middle" font-size="15" fill="#93a3c2">Ink ring, droplets and a press into the page</text>

<!-- Rest: a drop gathers on the nib, swells and falls. -->
<g transform="translate(1000 170)">
  <ellipse cx="0" cy="3" rx="1.6" ry="1.8" fill="#4058ff">
    <animate attributeName="rx" values="1.6;4.6;4.6;0" keyTimes="0;.8;.82;1" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="1.8;5.2;5.2;0" keyTimes="0;.8;.82;1" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="3;5;5;24" keyTimes="0;.8;.82;1" dur="2.6s" repeatCount="indefinite"/>
  </ellipse>
  <use xlink:href="#pen" transform="scale(1.7)"/>
</g>
<text x="1000" y="300" text-anchor="middle" font-size="22" fill="#f1f5ff">At rest it drips</text>
<text x="1000" y="326" text-anchor="middle" font-size="15" fill="#93a3c2">A drop gathers on the nib, swells and falls</text>
</g>
</svg>
