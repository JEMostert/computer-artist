<!doctype html>
<html><head><meta charset="utf-8"><title>Computer Artist reel</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="out" width="1920" height="1080"></canvas>
<script src="reel.js"></script>
<script>
// Driver: render frames [from, to) and POST each PNG to the frame server.
(async () => {
  const q = new URLSearchParams(location.search);
  const from = +(q.get('from') ?? 0), to = +(q.get('to') ?? 900), step = +(q.get('step') ?? 1);
  const list = q.get('frames') ? q.get('frames').split(',').map(Number) : null;
  const sub = +(q.get('sub') ?? 5);
  const log = (m) => fetch('/log', { method: 'POST', body: String(m) });
  const frames = list || [...Array(Math.ceil((to - from) / step)).keys()].map((k) => from + k * step);
  let written = 0;
  try {
    await Reel.load();
    const out = document.getElementById('out');
    const t0 = performance.now();
    for (const i of frames) {
      Reel.renderFrame(out, i, sub);
      const blob = await new Promise((r) => out.toBlob(r, 'image/png'));
      const reply = await fetch('/frame?i=' + i, { method: 'POST', body: blob });
      if (!reply.ok) throw new Error(`the server refused frame ${i}: HTTP ${reply.status}`);
      written++;
      if (i % 60 === 0) log(`frame ${i} ${((performance.now() - t0) / 1000).toFixed(1)}s`);
    }
  } catch (e) {
    await log('ERROR ' + (e && e.stack || e));
  }
  // render.sh succeeds only when every requested frame was written.
  await fetch(`/done?written=${written}&requested=${frames.length}`, { method: 'POST' });
})();
</script></body></html>
